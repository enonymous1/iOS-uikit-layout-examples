name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --strict
      - name: Build and test Radioactive Elements
        run: >
          xcodebuild test
          -project examples/radioactive-elements/RadioactiveElements.xcodeproj
          -scheme RadioactiveElements
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
      - name: Build and test Auto Layout
        run: >
          xcodebuild test
          -project examples/autolayout-exercises/AutoLayout.xcodeproj
          -scheme AutoLayout
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
      - name: Build and test Color Blender
        run: >
          xcodebuild test
          -project examples/color-blender/ColorBlender.xcodeproj
          -scheme ColorBlender
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
